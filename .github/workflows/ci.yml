name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

  privacy-guard:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Fail if DATA_FLOW.md is deleted or missing
        run: test -f docs/DATA_FLOW.md
      - name: Reminder — network-payload test required for stages 5 & 8
        run: |
          echo "Reminder: any change touching src/intent/ or src/voice/ must include a test"
          echo "asserting the outbound payload contains no raw message text, per DATA_FLOW.md."
